{% if is_paginated %}
<nav class="d-flex justify-content-center mt-5" aria-label="Pagination">
  <ul class="pagination">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link glass border-0" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.pricing %}&pricing={{ request.GET.pricing }}{% endif %}{% if request.GET.sort %}&sort={{ request.GET.sort }}{% endif %}">Prev</a></li>
    {% endif %}
    <li class="page-item"><span class="page-link glass border-0">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link glass border-0" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}{% if request.GET.pricing %}&pricing={{ request.GET.pricing }}{% endif %}{% if request.GET.sort %}&sort={{ request.GET.sort }}{% endif %}">Next</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
